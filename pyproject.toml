[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "askdata"
version = "0.1.0"
description = "A multi-step tool-using agent with a hand-written loop, retries, budgets, tracing, replay and evals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
e2e = ["playwright>=1.45", "pytest-playwright>=0.5"]

[project.scripts]
askdata = "agent.cli:main"

[tool.setuptools]
packages = ["agent", "agent.tools", "agent.web", "evals"]

[tool.setuptools.package-data]
evals = ["questions.yaml"]
"agent.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: browser tests of the web app (need `pip install -e '.[e2e]'` and `playwright install chromium`)"]
